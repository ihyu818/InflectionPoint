<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>三次函數配方練習</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
:root{--bg:#f6f7fb;--card:#fff;--fg:#1d2433;--mute:#667085;--line:#d5d9e3;--ok:#13795b;--bad:#c0392b;--acc:#3b5bdb;--key:#eceff6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1b2030;--fg:#e8ebf3;--mute:#9aa3b5;--line:#343b50;--ok:#4cc9a0;--bad:#ff7b6b;--acc:#8fa5ff;--key:#2a3148}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1b2030;--fg:#e8ebf3;--mute:#9aa3b5;--line:#343b50;--ok:#4cc9a0;--bad:#ff7b6b;--acc:#8fa5ff;--key:#2a3148}
*, *::before, *::after { box-sizing: border-box !important; }
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.9;touch-action:manipulation;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
main{width:100% !important;max-width:720px;margin:0 auto;padding:16px;min-height:100%;display:flex;flex-direction:column;overflow-x:hidden !important}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:12px}
h1{font-size:clamp(1.05rem,3.6vw,1.3rem);margin:0 0 2px}
.score{color:var(--mute);font-size:.9rem;margin:0}
.katex{font-size:1.15em}
.qcard{container-type:inline-size}
.q{font-size:clamp(1rem,3.4vw,1.2rem);overflow-x:auto;overflow-y:hidden}
.head{position:relative}
.rot{display:none;position:absolute;right:10px;top:8px;padding:4px 10px;font-size:.8rem}
.l3{white-space:nowrap}
.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px;max-width:520px}
.opt{padding:2px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);line-height:0}
.opt svg{width:100%;height:auto;display:block}
.opt.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
input{width:2.6em;font-size:1em;padding:3px 0;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);text-align:center;margin:0 2px;outline:none}
input.cur{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
button{font:inherit;border-radius:10px;border:1px solid var(--acc);background:transparent;color:var(--acc);cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#next{padding:6px 16px;margin-top:8px}
#msg{position:absolute;right:12px;bottom:8px;margin:0;font-weight:600;font-size:.9rem}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.pad{display:none;grid-template-columns:repeat(4,1fr);grid-auto-rows:clamp(36px,6.5dvh,48px);gap:5px;width:100%;max-width:440px;margin:auto auto 32px}
.pad button{background:var(--key);border:1px solid var(--line);color:var(--fg);font-size:clamp(1.2rem,3vw,1.6rem)}
.pad button:active{background:var(--acc);color:#fff}
.pad .enter{background:var(--acc);color:#fff;border-color:var(--acc);grid-column:span 2}
.pad .zero{grid-column:span 2}

#login-card input { width: 100% !important; margin: 0 !important; font-size: 16px !important; }

/* 連續綜合除法階梯排版 */
.syn-div-box {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 14px;
  margin: 10px 0;
  overflow-x: auto;
}
.syn-table {
  border-collapse: collapse;
  font-family: inherit;
  font-size: 1rem;
  margin: 0 auto;
}
.syn-table td {
  padding: 4px 4px;
  text-align: center;
  vertical-align: middle;
}
.syn-table input {
  width: 2.3em;
}
.syn-div-h {
  border-left: 2px solid var(--fg);
  padding-left: 6px !important;
}
.syn-line1 td:nth-child(-n+4) { border-bottom: 2px solid var(--fg); }
.syn-line1 td:nth-child(5) { border-left: 2px solid var(--fg); }
.syn-sep1 { border-right: 2px solid var(--fg); }

.syn-line2 td:nth-child(-n+3) { border-bottom: 2px solid var(--fg); }
.syn-line2 td:nth-child(4) { border-left: 2px solid var(--fg); }
.syn-sep2 { border-right: 2px solid var(--fg); }

.syn-line3 td:nth-child(-n+2) { border-bottom: 2px solid var(--fg); }
.syn-line3 td:nth-child(3) { border-left: 2px solid var(--fg); }

.rem-cell input {
  border-color: var(--acc) !important;
  font-weight: bold;
}

@media (pointer:coarse){
  html,body{overflow:hidden;overscroll-behavior:none}
  .rot{display:block}
  .head h1{padding-right:7.5em}
  main{height:100%;min-height:0;padding:6px 10px 0}
  .pad{display:grid}
  .card{margin-bottom:6px;padding:8px 12px}
  input{font-size:0.95em;width:2.2em;padding:2px 0;margin:0 1px}
  .q{line-height:1.85}
  .choices{margin-top:4px;gap:6px}
  #next{margin-top:4px;padding:4px 12px}
  .qcard{overflow-y:auto}
}
@media (pointer:coarse){
  html[data-layout="landscape"] main{flex-direction:row;flex-wrap:wrap;gap:0 12px;align-content:flex-start}
  html[data-layout="landscape"] .head{width:100%}
  html[data-layout="landscape"] .qcard{flex:1 1 55%}
  html[data-layout="landscape"] .pad{flex:1 1 38%;margin:0;grid-auto-rows:clamp(40px,12dvh,72px);gap:6px}
}
</style>
</head>
<body>
<main>
<!-- 1. 前置登錄卡片 -->
<div class="card" id="login-card" style="margin: auto auto; width: 100%; max-width: 360px;">
  <h2 style="margin: 0 0 12px; font-size: 1.25rem; font-weight: bold; text-align: center;">三次函數找對稱中心測驗</h2>
  <div style="display: flex; flex-direction: column; gap: 10px;">
    <div>
      <label style="display:block; font-size: 0.85rem; color: var(--mute); margin-bottom: 3px;">班級：</label>
      <input type="text" id="stu-class" placeholder="例如：101" style="width: 100%; text-align: left; padding: 8px 12px; border-radius: 8px;">
    </div>
    <div>
      <label style="display:block; font-size: 0.85rem; color: var(--mute); margin-bottom: 3px;">座號：</label>
      <input type="number" id="stu-no" placeholder="例如：05" style="width: 100%; text-align: left; padding: 8px 12px; border-radius: 8px;">
    </div>
    <div>
      <label style="display:block; font-size: 0.85rem; color: var(--mute); margin-bottom: 3px;">姓名：</label>
      <input type="text" id="stu-name" placeholder="請輸入姓名" style="width: 100%; text-align: left; padding: 8px 12px; border-radius: 8px;">
    </div>
    <div id="login-err" style="color: var(--bad); font-size: 0.85rem; min-height: 1.2em; text-align: center;"></div>
    <button type="button" id="start-btn" style="background: var(--acc); color: #fff; border: none; padding: 10px; font-weight: bold; border-radius: 8px; margin-top: 4px;">開始測驗 ➔</button>
  </div>
</div>

<!-- 2. 正式測驗主區域 -->
<div id="quiz-section" style="display:none; width: 100%; flex-direction: column; flex: 1;">
  <div class="card head">
    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
      <div>
        <h1>三次函數找對稱中心練習</h1>
        <span id="student-badge" style="font-size: 0.85rem; color: var(--acc); font-weight: bold;"></span>
      </div>
      <button id="rot" class="rot"></button>
    </div>
    <p class="score" id="score">答對 0 / 已作答 0</p>
    <div id="msg"></div>
  </div>

  <div class="card qcard">
    <div class="q">
      已知 <span id="eq"></span>，<br>
      若 <span id="eq2"></span>，<br>
      
      <!-- 連續綜合除法版面 -->
      <div class="syn-div-box" id="syn-box">
        <div style="font-size: 0.85rem; color: var(--mute); margin-bottom: 6px;">請利用連續綜合除法完成配方（缺項請補0）：</div>
        <table class="syn-table">
          <tr>
            <td><input id="c-a" inputmode="numeric"></td>
            <td><input id="c-b" inputmode="numeric"></td>
            <td><input id="c-c" inputmode="numeric"></td>
            <td><input id="c-d" inputmode="numeric"></td>
            <td class="syn-div-h"><input id="s-h" inputmode="numeric" aria-label="除數 h"></td>
          </tr>
          <tr class="syn-line1">
            <td></td>
            <td><input id="s-m1" inputmode="numeric"></td>
            <td><input id="s-m2" inputmode="numeric"></td>
            <td><input id="s-m3" inputmode="numeric"></td>
            <td></td>
          </tr>
          <tr>
            <td><input id="s-a1" inputmode="numeric"></td>
            <td><input id="s-r1" inputmode="numeric"></td>
            <td class="syn-sep1"><input id="s-r2" inputmode="numeric"></td>
            <td class="rem-cell"><input id="ik" inputmode="numeric" aria-label="k"></td>
            <td></td>
          </tr>
          <tr class="syn-line2">
            <td></td>
            <td><input id="s-m4" inputmode="numeric"></td>
            <td><input id="s-m5" inputmode="numeric"></td>
            <td colspan="2"></td>
          </tr>
          <tr>
            <td><input id="s-a2" inputmode="numeric"></td>
            <td class="syn-sep2"><input id="s-r3" inputmode="numeric"></td>
            <td class="rem-cell"><input id="ip" inputmode="numeric" aria-label="p"></td>
            <td colspan="2"></td>
          </tr>
          <tr class="syn-line3">
            <td></td>
            <td><input id="s-m6" inputmode="numeric"></td>
            <td colspan="3"></td>
          </tr>
          <tr>
            <td class="rem-cell"><input id="ia" inputmode="numeric" aria-label="a"></td>
            <td class="rem-cell"><input id="s-r4" inputmode="numeric" aria-label="b1"></td>
            <td colspan="3"></td>
          </tr>
        </table>
      </div>

      <span class="l3">其對稱中心為 <span class="t" data-t="("></span>
      <input id="ih2" inputmode="numeric" aria-label="對稱中心 x"><span class="t" data-t=","></span>
      <input id="ik2" inputmode="numeric" aria-label="對稱中心 y"><span class="t" data-t=")"></span>。</span><br>
      <span class="l3">又 <span class="t" data-t="y=f(x)"></span> 的圖形為</span>
    </div>
    <div class="choices" id="choices"></div>
    <button class="ghost" id="next">下一題</button>
  </div>

  <div class="pad" id="pad">
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button data-k="back" aria-label="退格">⌫</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button data-k="+">+</button>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="-">−</button>
    <button data-k="0" class="zero">0</button><button data-k="enter" class="enter">Enter</button>
  </div>
</div>
</main>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbz4uja4c5pIjbLajqqZwVO8SUmYwUhYGPSs-4Fo4xEbX6qcigeteHCmrFLYN9OgH4dWMw/exec";

let qStartTime = Date.now();
let qAttempts = 0;

function logStudentAction(isCorrect) {
  const durationSec = Math.round((Date.now() - qStartTime) / 1000);
  const payload = {
    cls: studentInfo.cls,
    no: studentInfo.no,
    name: studentInfo.name,
    eq: $('eq').innerText || "",
    answer: `(${Q.a}, ${Q.p}, ${Q.h}, ${Q.k})`,
    user_aphk: `(${$( 'ia').value}, ${$('ip').value}, ${$('s-h').value}, ${$('ik').value})`,
    user_center: `(${$('ih2').value}, ${$('ik2').value})`,
    graph_match: `選圖:${Q.sel + 1} / 正確:${Q.ans + 1} (${Q.sel === Q.ans ? '吻合' : '不吻合'})`,
    is_correct: isCorrect,
    attempts: qAttempts,
    duration: durationSec
  };
  fetch(GAS_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).catch(e => console.error(e));
}

const R = (l, u) => Math.floor(Math.random() * (u - l + 1)) + l;
const $ = id => document.getElementById(id);

// 依紅筆箭頭運算順序設置跳格
const IDS = [
  'c-a', 'c-b', 'c-c', 'c-d', 's-h',
  's-a1', 's-m1', 's-r1', 's-m2', 's-r2', 's-m3', 'ik',
  's-a2', 's-m4', 's-r3', 's-m5', 'ip',
  'ia', 's-m6', 's-r4',
  'ih2', 'ik2'
];

const KEY = {
  'c-a':'a', 'c-b':'b', 'c-c':'c', 'c-d':'d', 's-h':'h',
  's-a1':'a', 's-m1':'m1', 's-r1':'r1', 's-m2':'m2', 's-r2':'r2', 's-m3':'m3', 'ik':'k',
  's-a2':'a', 's-m4':'m4', 's-r3':'r3', 's-m5':'m5', 'ip':'p',
  'ia':'a', 's-m6':'m6', 's-r4':'r4',
  'ih2':'h', 'ik2':'k'
};

const touch = matchMedia('(pointer: coarse)').matches;
let Q, tried = 0, right = 0, cur = $('c-a');

function tex(el, s) {
  try { el.innerHTML = katex.renderToString(s, { output: 'html', throwOnError: false }); }
  catch(e) { el.textContent = s; }
}

function gen() {
  for(;;){
    const a = R(-3, 3), h = R(-4, 4), p = R(-7, 7), k = R(-5, 5);
    if(a === 0 || h === 0) continue;
    const b = -3 * a * h;
    const c = 3 * a * h * h + p;
    const d = -a * h * h * h - p * h + k;
    if(Math.abs(b) <= 99 && Math.abs(c) <= 99 && Math.abs(d) <= 99){
      return { a, h, p, k, b, c, d };
    }
  }
}

function poly(cs) {
  const pw = [3, 2, 1, 0]; let s = '';
  cs.forEach((c, i) => {
    if(c === 0) return;
    const n = pw[i], ab = Math.abs(c);
    let t = (ab === 1 && n > 0) ? '' : String(ab);
    if(n === 1) t += 'x'; else if(n > 1) t += 'x^{' + n + '}';
    s += s === '' ? (c < 0 ? '-' : '') + t : (c < 0 ? ' - ' : ' + ') + t;
  });
  return s === '' ? '0' : s;
}

function setCur(e) {
  cur = e;
  IDS.forEach(i => {
    const el = $(i);
    if(el) el.classList.toggle('cur', el === e);
  });
}

function clean(s) {
  s = s.replace(/\u2212/g, '-');
  const sign = /^[+-]/.test(s) ? s[0] : '';
  return sign + s.replace(/[^0-9]/g, '').slice(0, 3);
}

function put(k) {
  if(!cur) return;
  let v = cur.value;
  if(k === 'back') v = v.slice(0, -1);
  else if(k === '+' || k === '-') { if(!/^[+-]/.test(v)) v = k + v; v = clean(v); }
  else v = clean(v + k);
  cur.value = v;
  autoNext(cur);
}

const isRight = id => {
  const el = $(id);
  if(!el) return false;
  const v = el.value.trim().replace('\u2212', '-');
  return /^[+-]?\d+$/.test(v) && Number(v) === Q[KEY[id]];
};

function autoNext(e) {
  if(Q.done || !isRight(e.id)) return;
  const i = IDS.indexOf(e.id);
  if(IDS.every(isRight) && Q.sel === Q.ans){ check(); return; }
  if(i < IDS.length - 1){
    const n = $(IDS[i + 1]);
    if(n){ setCur(n); if(!touch) n.focus(); }
  }
}

function shuffle(arr) {
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function curve(sa, sp) {
  let d = '';
  for(let i = 0; i <= 80; i++){
    const u = -2.1 + 4.2 * i / 80, y = sa * u * u * u + 3 * sp * u;
    if(Math.abs(y) > 5.6) continue;
    d += (d ? 'L' : 'M') + (70 + u * 32).toFixed(1) + ' ' + (70 - y * 12.4).toFixed(1);
  }
  return `<svg viewBox="0 0 140 140" aria-hidden="true"><path d="${d}" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function newQ() {
  qStartTime = Date.now();
  qAttempts = 0;
  Q = gen();
  Q.done = false;

  Q.r1 = Q.b + Q.a * Q.h;
  Q.r2 = Q.c + Q.r1 * Q.h;
  Q.m1 = Q.a * Q.h;
  Q.m2 = Q.r1 * Q.h;
  Q.m3 = Q.r2 * Q.h;

  Q.r3 = Q.r1 + Q.a * Q.h;
  Q.m4 = Q.a * Q.h;
  Q.m5 = Q.r3 * Q.h;

  Q.m6 = Q.a * Q.h;
  Q.r4 = 0;

  tex($('eq'), 'f(x)=' + poly([Q.a, Q.b, Q.c, Q.d]));
  tex($('eq2'), 'f(x)=a(x-h)^{3}+p(x-h)+k');
  IDS.forEach(i => { if($(i)) $(i).value = ''; });

  const sa = Math.sign(Q.a), sp = Math.sign(Q.p);
  const opts = [[sa, sp], [sa, -sp], [-sa, sp], [-sa, -sp]];
  const order = shuffle([0, 1, 2, 3]);
  Q.ans = order.indexOf(0);
  Q.sel = -1;
  $('choices').innerHTML = order.map((o, i) => `<button class="opt" data-i="${i}" aria-label="選項 ${i+1}">${curve(opts[o][0], opts[o][1])}</button>`).join('');
  $('msg').textContent = '';
  setCur($('c-a'));
  if(!touch) $('c-a').focus();
}

const check = () => {
  if(Q.done){ newQ(); return; }
  const v = IDS.map(i => $(i) ? $(i).value.trim().replace('\u2212', '-') : '');

  if(v.some(x => !/^[+-]?\d+$/.test(x))){
    $('msg').className = 'bad';
    $('msg').textContent = '請完整填寫綜合除法所有空格！';
    return;
  }
  if(Q.sel < 0){
    $('msg').className = 'bad';
    $('msg').textContent = '請點選一張圖。';
    return;
  }

  tried++;
  qAttempts++;

  const allCorrect = IDS.every(isRight);

  if(allCorrect && Q.sel === Q.ans){
    right++;
    Q.done = true;
    $('msg').className = 'ok';
    $('msg').textContent = '答對了！按 Enter 下一題';
    logStudentAction(true);
  } else {
    $('msg').className = 'bad';
    $('msg').textContent = '綜合除法或圖形有錯，再檢查看看。';
  }
  $('score').textContent = `答對 ${right} / 已作答 ${tried}`;
};

IDS.forEach(i => {
  const e = $(i);
  if(!e) return;
  if(touch){ e.readOnly = true; e.setAttribute('inputmode', 'none'); }
  e.addEventListener('focus', () => setCur(e));
  e.addEventListener('pointerdown', () => setCur(e));
  e.addEventListener('input', () => {
    const v = clean(e.value);
    if(v !== e.value) e.value = v;
    autoNext(e);
  });
  e.addEventListener('keydown', ev => {
    if(ev.key === 'Enter'){ ev.preventDefault(); check(); return; }
    if(touch){
      if(/^[0-9+-]$/.test(ev.key)){ ev.preventDefault(); put(ev.key); }
      else if(ev.key === 'Backspace'){ ev.preventDefault(); put('back'); }
    }
  });
});

$('choices').addEventListener('click', ev => {
  const b = ev.target.closest('.opt'); if(!b || Q.done) return;
  Q.sel = +b.dataset.i;
  document.querySelectorAll('.opt').forEach(o => o.classList.toggle('sel', o === b));
  if(IDS.every(isRight) && Q.sel === Q.ans) check();
});

$('pad').addEventListener('click', ev => {
  const b = ev.target.closest('button'); if(!b) return;
  const k = b.dataset.k;
  if(k === 'enter') check(); else put(k);
});

const root = document.documentElement;
let layout = null;
try{ layout = localStorage.getItem('layout'); }catch(e){}
if(layout !== 'portrait' && layout !== 'landscape') layout = Math.min(screen.width, screen.height) >= 600 ? 'landscape' : 'portrait';
function applyLayout(){
  root.dataset.layout = layout;
  $('rot').textContent = layout === 'portrait' ? '切換為橫式排版' : '切換為直式排版';
}
$('rot').onclick = () => {
  layout = layout === 'portrait' ? 'landscape' : 'portrait';
  try{ localStorage.setItem('layout', layout); }catch(e){}
  applyLayout();
};

let studentInfo = {
  cls: localStorage.getItem('cubic_cls') || '',
  no: localStorage.getItem('cubic_no') || '',
  name: localStorage.getItem('cubic_name') || ''
};

$('stu-class').value = studentInfo.cls;
$('stu-no').value = studentInfo.no;
$('stu-name').value = studentInfo.name;

function startQuiz() {
  const cls = $('stu-class').value.trim();
  const no = $('stu-no').value.trim();
  const name = $('stu-name').value.trim();

  if(!cls || !no || !name) {
    $('login-err').textContent = '請完整填寫班級、座號與姓名！';
    return;
  }

  localStorage.setItem('cubic_cls', cls);
  localStorage.setItem('cubic_no', no);
  localStorage.setItem('cubic_name', name);
  studentInfo = { cls, no, name };

  $('student-badge').textContent = `${cls} 班 ${no} 號 ${name}`;

  $('login-card').style.display = 'none';
  $('quiz-section').style.display = 'flex';

  newQ();
}

$('start-btn').onclick = startQuiz;

['stu-class', 'stu-no', 'stu-name'].forEach(id => {
  $(id).addEventListener('keydown', e => {
    if(e.key === 'Enter') startQuiz();
  });
});

applyLayout();
document.addEventListener('gesturestart', e => e.preventDefault());
$('next').onclick = newQ;
document.querySelectorAll('.t').forEach(e => tex(e, e.dataset.t));
</script>
</body>
</html>
